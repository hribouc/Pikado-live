<!doctype html><html lang="sl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091b1c"><title>PIKADO LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:#08191a;color:#f3faf7;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:25px;letter-spacing:-1px}small,.muted{color:#91ada5}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:#fff;background:#284a46}button:active{transform:scale(.98)}button:disabled{opacity:.45}.primary{background:#b7f65a;color:#10230b}.outline{background:#203735}.card{background:#11282a;border:1px solid #2b4b47;border-radius:20px;padding:17px;margin-bottom:13px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}input,select{background:#091c1d;border:1px solid #40615a;border-radius:12px;color:white;padding:12px;min-width:0;width:100%}label{display:block;color:#b8ccc5;font-size:13px;margin:12px 0 5px}.number{font-size:78px;line-height:1;font-weight:900;letter-spacing:-4px;color:#b7f65a}.hero{text-align:center;padding:25px 10px}.hero h2{font-size:30px;margin:4px}.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scorecard{padding:12px;border-radius:13px;background:#193132;border:1px solid #36504b}.scorecard.active{border:2px solid #b7f65a}.scorecard b{display:block;font-size:28px}.scorecard span{font-size:13px;color:#c0d2cc}.entry{display:grid;grid-template-columns:1fr auto;gap:7px}.entry input{font-size:27px;font-weight:800;text-align:center}.entry button{font-size:20px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px 5px;border-bottom:1px solid #294440;font-size:14px}.table th{color:#91ada5;font-weight:500}.table td:not(:first-child),.table th:not(:first-child){text-align:right}.pill{font-size:12px;border:1px solid #44695d;border-radius:100px;padding:6px 9px}.notice{color:#ffcb82;min-height:22px;font-size:13px}.win{background:#32461b;color:#d5ff8d;padding:15px;border-radius:14px;text-align:center;font-size:23px;font-weight:900}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.names input{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.checkout{font-size:14px;color:#c0edaa;margin-top:9px}.checkout-route{margin-top:5px}.checkout small{display:block;font-size:11px;line-height:1.5;margin-top:8px}.voiceStatus{font-size:13px;color:#bdd4cd;margin-top:9px;min-height:20px}#mic.listening{background:#f44c6e}#game{display:none}#game.active{display:block}@media(min-width:600px){.scores{grid-template-columns:repeat(4,1fr)}} body.playing header small{display:none}body.playing header{margin-bottom:8px}body.playing header h1{font-size:20px}body.playing #settingsBtn{font-size:12px;padding:9px 12px}body.playing #game>.card:first-child{padding:12px}body.playing .scorecard{min-height:76px}body.playing .scorecard b{font-size:30px}body.playing .hero{padding:10px 0}body.playing .hero .number{font-size:clamp(66px,14vw,110px)}body.playing #game>.card:nth-child(2){padding:14px}body.playing #soundGame{display:none}body.playing #nextGame{width:100%;margin-top:8px}body.playing .actions{margin-top:7px}body.playing main{padding-top:10px}body.playing #game+.card{padding:13px}body.playing #game+.card h2{font-size:18px}@media(max-width:550px){body.playing .scores{grid-template-columns:repeat(2,minmax(0,1fr))}body.playing .entry{gap:7px}body.playing .entry button{padding:12px}} </style><main><header><div><h1>🎯 PIKADO <span style="color:#b7f65a">LIVE</span></h1><small>Rezultati · lestvica · v11</small></div><button id="settingsBtn" class="outline">⚙️ Nastavitve</button></header><section id="setup" class="card"><h2>Nova igra</h2><div class="settings"><div><label>Začetni rezultat</label><select id="start"><option>501</option><option>301</option></select></div><div><label>Zaključek</label><select id="finish"><option value="single">Brez Double Out</option><option value="double">Double Out</option></select></div></div><label>Število igralcev</label><div class="flex"><button id="minus">−</button><strong id="countLabel" style="font-size:26px">2</strong><button id="plus">+</button></div><div id="names" class="names" style="margin-top:12px"></div><button class="primary" id="new" style="width:100%;margin-top:16px">ZAČNI IGRO →</button><div class="actions"><button id="soundTest">🔊 Preizkusi glas</button><button id="resetStats" class="outline">Ponastavi lestvico</button></div><div class="voiceStatus" id="soundInfo">Rezultate vnašaš ročno.</div></section><div id="game"><section class="card"><div class="flex"><b>TEKOČA IGRA</b><span class="pill" id="round">1. krog</span></div><div class="scores" id="scores" style="margin-top:12px"></div></section><section class="card"><div class="hero"><small>NA POTEZI</small><h2 id="current">Igralec 1</h2><div class="number" id="remaining">501</div><div class="checkout" id="checkout"></div></div><div class="win hidden" id="winner"></div><form class="entry" id="entry"><input type="number" id="points" min="0" max="180" inputmode="numeric" placeholder="Točke" required><button class="primary" type="submit">✓</button></form><div class="voiceStatus" id="status">Vnesi skupni rezultat treh puščic.</div><div class="actions"><button id="undo" class="outline">↶ Razveljavi</button><button id="nextGame" class="primary hidden">↻ Nova igra</button><button id="soundGame" class="outline">🔊 Test</button></div></section></div><section class="card"><div class="flex"><h2 style="margin:0">🏆 Lestvica</h2><span class="pill">Skupno vse igre</span></div><table class="table"><thead><tr><th>Igralec</th><th>Zmage</th><th>Porazi</th><th>Uspešnost</th></tr></thead><tbody id="ranking"></tbody></table></section></main><script>
const $=id=>document.getElementById(id),KEY='pikado-live-v6';let db={count:2,names:[],stats:{},game:null},audioCtx=null;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')db={...db,...x}}catch{};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[523,659,784,1047].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.23)})}catch{}}function speak(s){beep();if(!('speechSynthesis'in window)){msg('Govorna najava v tem brskalniku ni podprta.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='sl-SI';u.rate=.92;u.volume=1;speechSynthesis.speak(u)}catch(e){msg('Govorna najava ni uspela.')}}function msg(t){$('status').textContent=t;$('soundInfo').textContent=t}function names(){let old=[...$('names').querySelectorAll('input')].map(e=>e.value);if(old.length)db.names=old;db.names=Array.from({length:db.count},(_,i)=>db.names[i]||'Igralec '+(i+1));$('countLabel').textContent=db.count;$('names').replaceChildren();db.names.forEach((v,i)=>{let e=document.createElement('input');e.value=v;e.placeholder='Igralec '+(i+1);e.oninput=()=>db.names[i]=e.value;$('names').append(e)})}function ranking(){let rows=Object.entries(db.stats).map(([name,s])=>({name,...s})).sort((a,b)=>b.w-a.w||a.l-b.l);$('ranking').replaceChildren();if(!rows.length){let tr=document.createElement('tr');tr.innerHTML='<td colspan="4">Lestvica je še prazna.</td>';$('ranking').append(tr)}rows.forEach(s=>{let tr=document.createElement('tr');[s.name,s.w,s.l,Math.round(100*s.w/(s.w+s.l||1))+' %'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});$('ranking').append(tr)})}
const checkoutCache=new Map();
function checkoutRoutes(score,finish){
 const key=score+':'+finish;if(checkoutCache.has(key))return checkoutCache.get(key);
 const doubleOut=finish==='double';
 if(!Number.isInteger(score)||score<=0||score>(doubleOut?170:180))return [];
 const fields=[];
 for(let n=20;n>=1;n--)fields.push({label:'S'+n,value:n,difficulty:0});
 fields.push({label:'25',value:25,difficulty:3});
 for(let n=20;n>=1;n--)fields.push({label:'D'+n,value:2*n,difficulty:2,double:true});
 fields.push({label:'BULL',value:50,difficulty:4,double:true});
 for(let n=20;n>=1;n--)fields.push({label:'T'+n,value:3*n,difficulty:3});
 fields.forEach((field,index)=>field.order=index);
 const endings=new Map();
 for(const field of fields){if(doubleOut&&!field.double)continue;const list=endings.get(field.value)||[];list.push(field);endings.set(field.value,list)}
 const routes=[],seen=new Set();
 const add=prefix=>{
  const remaining=score-prefix.reduce((sum,field)=>sum+field.value,0);
  for(const last of endings.get(remaining)||[]){
   const route=[...prefix,last];
   const canonical=doubleOut?[...prefix.map(f=>f.label).sort(),last.label]:route.map(f=>f.label).sort();
   const id=canonical.join('/');if(seen.has(id))continue;seen.add(id);routes.push(route);
  }
 };
 add([]);
 for(let i=0;i<fields.length;i++){
  const first=fields[i];if(first.value>=score)continue;add([first]);
  for(let j=i;j<fields.length;j++){
   const second=fields[j];if(first.value+second.value>=score)continue;add([first,second]);
  }
 }
 routes.sort((a,b)=>a.length-b.length||a.reduce((s,f)=>s+f.difficulty,0)-b.reduce((s,f)=>s+f.difficulty,0)||a.reduce((s,f)=>s+f.order,0)-b.reduce((s,f)=>s+f.order,0)||a.map(f=>f.label).join('/').localeCompare(b.map(f=>f.label).join('/')));
 const result=routes.slice(0,3).map(route=>route.map(f=>({label:f.label,value:f.value})));
 checkoutCache.set(key,result);return result;
}
function renderCheckout(game){
 const box=$('checkout');box.replaceChildren();if(game.done)return;
 const score=game.players[game.active].score,routes=checkoutRoutes(score,game.finish);
 const title=document.createElement('div');
 if(!routes.length){if(score<=180){title.textContent='Za ta rezultat ni zaključka v treh puščicah.';box.append(title)}return}
 title.textContent='🎯 Zaključek · '+score+' točk';box.append(title);
 routes.forEach((route,index)=>{
  const line=document.createElement('div');line.className='checkout-route';
  const number=route.length===1&&route[0].label.startsWith('T')?' (3 × '+route[0].label.slice(1)+')':'';
  line.textContent=(index===0?'Predlog: ':'Možnost: ')+route.map(f=>f.label).join(' → ')+number;
  box.append(line);
 });
 const legend=document.createElement('small');legend.textContent='S = enojno · D = dvojno · T = trojno · 25 = zunanji bull · BULL = 50';
 box.append(legend);
}

function render(){let g=db.game;document.body.classList.toggle('playing',!!g);$('setup').classList.toggle('hidden',!!g);$('game').classList.toggle('active',!!g);ranking();if(!g)return;$('round').textContent=g.round+'. krog';$('scores').replaceChildren();g.players.forEach((p,i)=>{let e=document.createElement('div');e.className='scorecard'+(g.active===i&&!g.done?' active':'');let n=document.createElement('span'),s=document.createElement('b');n.textContent=p.name;s.textContent=p.score;e.append(n,s);$('scores').append(e)});let p=g.players[g.active];$('current').textContent=p.name;$('remaining').textContent=p.score;$('entry').classList.toggle('hidden',g.done);$('nextGame').classList.toggle('hidden',!g.done);$('winner').classList.toggle('hidden',!g.done);$('winner').textContent=g.done?'🏆 Zmagovalec: '+g.players[g.winner].name:'';$('undo').disabled=!g.history.length;renderCheckout(g);persist()}
function begin(){db.names=[...$('names').querySelectorAll('input')].map((e,i)=>e.value.trim()||'Igralec '+(i+1));let names=[...new Set(db.names)];if(names.length!==db.names.length){msg('Vsak igralec potrebuje različno ime.');return}let start=+$('start').value;db.game={start,finish:$('finish').value,players:db.names.map(name=>({name,score:start})),active:0,round:1,history:[],done:false,winner:null};persist();render()}function submit(n){let g=db.game;if(!g||g.done)return;if(!Number.isInteger(n)||n<0||n>180){msg('Vnesi celo število med 0 in 180.');return}let snapshot=JSON.parse(JSON.stringify({players:g.players,active:g.active,round:g.round,done:g.done,winner:g.winner,stats:db.stats}));g.history.push(snapshot);let p=g.players[g.active],r=p.score-n,bust=r<0||(g.finish==='double'&&r===1);if(r===0&&g.finish==='double'&&!confirm('Je zadnja puščica zadela dvojno polje?'))bust=true;if(!bust)p.score=r;if(r===0&&!bust){g.done=true;g.winner=g.active;g.players.forEach((x,i)=>{let s=db.stats[x.name]||(db.stats[x.name]={w:0,l:0});if(i===g.winner)s.w++;else s.l++});render();speak('Zmagovalec je '+p.name+'!');msg('Igra zaključena.');return}if(!bust&&r===0){}g.active=(g.active+1)%g.players.length;if(g.active===0)g.round++;$('points').value='';msg(bust?'BUST! Rezultat ostane nespremenjen.':'Vpisano: '+n);render()}
$('minus').onclick=()=>{db.count=Math.max(1,db.count-1);names()};$('plus').onclick=()=>{db.count=Math.min(8,db.count+1);names()};$('new').onclick=begin;$('settingsBtn').onclick=()=>{if(db.game&&!confirm('Zapustim tekočo igro? Rezultati te igre se ne bodo šteli.'))return;db.game=null;render()};$('nextGame').onclick=()=>{const g=db.game;if(!g?.done)return;db.game={start:g.start,finish:g.finish,players:g.players.map(p=>({name:p.name,score:g.start})),active:0,round:1,history:[],done:false,winner:null};$('points').value='';msg('Nova igra. Na potezi: '+db.game.players[0].name+'.');render()};$('entry').onsubmit=e=>{e.preventDefault();submit(+$('points').value)};$('undo').onclick=()=>{let g=db.game;if(!g?.history.length)return;let x=g.history.pop();Object.assign(g,{players:x.players,active:x.active,round:x.round,done:x.done,winner:x.winner});db.stats=x.stats;render();msg('Zadnji met razveljavljen.')};$('resetStats').onclick=()=>{if(confirm('Izbrišem vse zmage in poraze?')){db.stats={};render()}};$('soundTest').onclick=()=>speak('Preizkus zvoka. Pikado je pripravljen.');$('soundGame').onclick=()=>speak('Preizkus zvoka.');
names();render();
</script></html>
