<!doctype html><html lang="sl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091b1c"><title>PIKADO LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:#08191a;color:#f3faf7;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:25px;letter-spacing:-1px}small,.muted{color:#91ada5}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:#fff;background:#284a46}button:active{transform:scale(.98)}button:disabled{opacity:.45}.primary{background:#b7f65a;color:#10230b}.outline{background:#203735}.card{background:#11282a;border:1px solid #2b4b47;border-radius:20px;padding:17px;margin-bottom:13px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}input,select{background:#091c1d;border:1px solid #40615a;border-radius:12px;color:white;padding:12px;min-width:0;width:100%}label{display:block;color:#b8ccc5;font-size:13px;margin:12px 0 5px}.number{font-size:78px;line-height:1;font-weight:900;letter-spacing:-4px;color:#b7f65a}.hero{text-align:center;padding:25px 10px}.hero h2{font-size:30px;margin:4px}.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scorecard{padding:12px;border-radius:13px;background:#193132;border:1px solid #36504b}.scorecard.active{border:2px solid #b7f65a}.scorecard b{display:block;font-size:28px}.scorecard span{font-size:13px;color:#c0d2cc}.entry{display:grid;grid-template-columns:1fr auto auto;gap:7px}.entry input{font-size:27px;font-weight:800;text-align:center}.entry button{font-size:20px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px 5px;border-bottom:1px solid #294440;font-size:14px}.table th{color:#91ada5;font-weight:500}.table td:not(:first-child),.table th:not(:first-child){text-align:right}.pill{font-size:12px;border:1px solid #44695d;border-radius:100px;padding:6px 9px}.notice{color:#ffcb82;min-height:22px;font-size:13px}.win{background:#32461b;color:#d5ff8d;padding:15px;border-radius:14px;text-align:center;font-size:23px;font-weight:900}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.names input{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.checkout{font-size:14px;color:#c0edaa;margin-top:9px}.voiceStatus{font-size:13px;color:#bdd4cd;margin-top:9px;min-height:20px}#mic.listening{background:#f44c6e}#game{display:none}#game.active{display:block}@media(min-width:600px){.scores{grid-template-columns:repeat(4,1fr)}} body.playing header small{display:none}body.playing header{margin-bottom:8px}body.playing header h1{font-size:20px}body.playing #settingsBtn{font-size:12px;padding:9px 12px}body.playing #game>.card:first-child{padding:12px}body.playing .scorecard{min-height:76px}body.playing .scorecard b{font-size:30px}body.playing .hero{padding:10px 0}body.playing .hero .number{font-size:clamp(66px,14vw,110px)}body.playing #game>.card:nth-child(2){padding:14px}body.playing #soundGame{display:none}body.playing #nextGame{display:none}body.playing .actions{margin-top:7px}body.playing main{padding-top:10px}body.playing #game+.card{padding:13px}body.playing #game+.card h2{font-size:18px}@media(max-width:550px){body.playing .scores{grid-template-columns:repeat(2,minmax(0,1fr))}body.playing .entry{gap:7px}body.playing .entry button{padding:12px}} </style><main><header><div><h1>🎯 PIKADO <span style="color:#b7f65a">LIVE</span></h1><small>Rezultati · lestvica · glasovni vnos</small></div><button id="settingsBtn" class="outline">⚙️ Nastavitve</button></header><section id="setup" class="card"><h2>Nova igra</h2><div class="settings"><div><label>Začetni rezultat</label><select id="start"><option>501</option><option>301</option></select></div><div><label>Zaključek</label><select id="finish"><option value="single">Brez Double Out</option><option value="double">Double Out</option></select></div></div><label>Število igralcev</label><div class="flex"><button id="minus">−</button><strong id="countLabel" style="font-size:26px">2</strong><button id="plus">+</button></div><div id="names" class="names" style="margin-top:12px"></div><button class="primary" id="new" style="width:100%;margin-top:16px">ZAČNI IGRO →</button><div class="actions"><button id="soundTest">🔊 Preizkusi glas</button><button id="resetStats" class="outline">Ponastavi lestvico</button></div><div class="voiceStatus" id="soundInfo">Za glasovni vnos potrebuješ HTTPS in dovoljenje za mikrofon.</div></section><div id="game"><section class="card"><div class="flex"><b>TEKOČA IGRA</b><span class="pill" id="round">1. krog</span></div><div class="scores" id="scores" style="margin-top:12px"></div></section><section class="card"><div class="hero"><small>NA POTEZI</small><h2 id="current">Igralec 1</h2><div class="number" id="remaining">501</div><div class="checkout" id="checkout"></div></div><div class="win hidden" id="winner"></div><form class="entry" id="entry"><input type="number" id="points" min="0" max="180" inputmode="numeric" placeholder="Točke" required><button type="button" id="mic" aria-label="Povej rezultat">🎙️</button><button class="primary" type="submit">✓</button></form><div class="voiceStatus" id="status">Povej skupni rezultat treh puščic ali ga vnesi.</div><div class="actions"><button id="undo" class="outline">↶ Razveljavi</button><button id="nextGame" class="outline">Nova igra</button><button id="soundGame" class="outline">🔊 Test</button></div></section></div><section class="card"><div class="flex"><h2 style="margin:0">🏆 Lestvica</h2><span class="pill">Skupno vse igre</span></div><table class="table"><thead><tr><th>Igralec</th><th>Zmage</th><th>Porazi</th><th>Uspešnost</th></tr></thead><tbody id="ranking"></tbody></table></section></main><script>
const $=id=>document.getElementById(id),KEY='pikado-live-v6';let db={count:2,names:[],stats:{},game:null},rec=null,audioCtx=null;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')db={...db,...x}}catch{};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[523,659,784,1047].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.23)})}catch{}}function speak(s){beep();if(!('speechSynthesis'in window)){msg('Govorna najava v tem brskalniku ni podprta.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='sl-SI';u.rate=.92;u.volume=1;speechSynthesis.speak(u)}catch(e){msg('Govorna najava ni uspela.')}}function msg(t){$('status').textContent=t;$('soundInfo').textContent=t}function names(){let old=[...$('names').querySelectorAll('input')].map(e=>e.value);if(old.length)db.names=old;db.names=Array.from({length:db.count},(_,i)=>db.names[i]||'Igralec '+(i+1));$('countLabel').textContent=db.count;$('names').replaceChildren();db.names.forEach((v,i)=>{let e=document.createElement('input');e.value=v;e.placeholder='Igralec '+(i+1);e.oninput=()=>db.names[i]=e.value;$('names').append(e)})}function ranking(){let rows=Object.entries(db.stats).map(([name,s])=>({name,...s})).sort((a,b)=>b.w-a.w||a.l-b.l);$('ranking').replaceChildren();if(!rows.length){let tr=document.createElement('tr');tr.innerHTML='<td colspan="4">Lestvica je še prazna.</td>';$('ranking').append(tr)}rows.forEach(s=>{let tr=document.createElement('tr');[s.name,s.w,s.l,Math.round(100*s.w/(s.w+s.l||1))+' %'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});$('ranking').append(tr)})}function render(){let g=db.game;document.body.classList.toggle('playing',!!g);$('setup').classList.toggle('hidden',!!g);$('game').classList.toggle('active',!!g);ranking();if(!g)return;$('round').textContent=g.round+'. krog';$('scores').replaceChildren();g.players.forEach((p,i)=>{let e=document.createElement('div');e.className='scorecard'+(g.active===i&&!g.done?' active':'');let n=document.createElement('span'),s=document.createElement('b');n.textContent=p.name;s.textContent=p.score;e.append(n,s);$('scores').append(e)});let p=g.players[g.active];$('current').textContent=p.name;$('remaining').textContent=p.score;$('entry').classList.toggle('hidden',g.done);$('winner').classList.toggle('hidden',!g.done);$('winner').textContent=g.done?'🏆 Zmagovalec: '+g.players[g.winner].name:'';$('undo').disabled=!g.history.length;let routes=[];if(!g.done&&p.score<100){let n=p.score;if(g.finish==='single'){if(n<=20)routes=['S'+n];else if(n<=60&&n%3===0)routes=['T'+(n/3)];else if(n<=40&&n%2===0)routes=['D'+(n/2)];else routes=['S'+Math.min(20,n-1)+' → '+(n-Math.min(20,n-1))]}else{if(n===50)routes=['BULL'];else if(n<=40&&n%2===0)routes=['D'+(n/2)];else if(n>40&&n<=60&&n%2===0)routes=['S'+(n-40)+' → D20'];else if(n>60&&n<=98&&n%2===0)routes=['T'+Math.floor((n-40)/3)+' → D'+((n-3*Math.floor((n-40)/3))/2)]} }$('checkout').textContent=routes.length?'🎯 Zaključek: '+routes[0]:'';persist()}
function begin(){db.names=[...$('names').querySelectorAll('input')].map((e,i)=>e.value.trim()||'Igralec '+(i+1));let names=[...new Set(db.names)];if(names.length!==db.names.length){msg('Vsak igralec potrebuje različno ime.');return}let start=+$('start').value;db.game={start,finish:$('finish').value,players:db.names.map(name=>({name,score:start})),active:0,round:1,history:[],done:false,winner:null};persist();render()}function submit(n){let g=db.game;if(!g||g.done)return;if(!Number.isInteger(n)||n<0||n>180){msg('Vnesi celo število med 0 in 180.');return}let snapshot=JSON.parse(JSON.stringify({players:g.players,active:g.active,round:g.round,done:g.done,winner:g.winner,stats:db.stats}));g.history.push(snapshot);let p=g.players[g.active],r=p.score-n,bust=r<0||(g.finish==='double'&&r===1);if(r===0&&g.finish==='double'&&!confirm('Je zadnja puščica zadela dvojno polje?'))bust=true;if(!bust)p.score=r;if(r===0&&!bust){g.done=true;g.winner=g.active;g.players.forEach((x,i)=>{let s=db.stats[x.name]||(db.stats[x.name]={w:0,l:0});if(i===g.winner)s.w++;else s.l++});render();speak('Zmagovalec je '+p.name+'!');msg('Igra zaključena.');return}if(!bust&&r===0){}g.active=(g.active+1)%g.players.length;if(g.active===0)g.round++;$('points').value='';msg(bust?'BUST! Rezultat ostane nespremenjen.':'Vpisano: '+n);render()}
$('minus').onclick=()=>{db.count=Math.max(1,db.count-1);names()};$('plus').onclick=()=>{db.count=Math.min(8,db.count+1);names()};$('new').onclick=begin;$('settingsBtn').onclick=()=>{if(db.game&&!confirm('Zapustim tekočo igro? Rezultati te igre se ne bodo šteli.'))return;db.game=null;render()};$('nextGame').onclick=()=>{if(db.game&&!db.game.done&&!confirm('Prekinem tekočo igro?'))return;db.game=null;render()};$('entry').onsubmit=e=>{e.preventDefault();submit(+$('points').value)};$('undo').onclick=()=>{let g=db.game;if(!g?.history.length)return;let x=g.history.pop();Object.assign(g,{players:x.players,active:x.active,round:x.round,done:x.done,winner:x.winner});db.stats=x.stats;render();msg('Zadnji met razveljavljen.')};$('resetStats').onclick=()=>{if(confirm('Izbrišem vse zmage in poraze?')){db.stats={};render()}};$('soundTest').onclick=()=>speak('Preizkus zvoka. Pikado je pripravljen.');$('soundGame').onclick=()=>speak('Preizkus zvoka.');
function parseNumber(s){s=s.toLowerCase().trim().replace(/[^\p{L}\d\s-]/gu,' ');let n=s.match(/\b\d{1,3}\b/);if(n)return +n[0];let map={'nič':0,'ena':1,'en':1,'dva':2,'tri':3,'štiri':4,'pet':5,'šest':6,'sedem':7,'osem':8,'devet':9,'deset':10,'enajst':11,'dvanajst':12,'trinajst':13,'štirinajst':14,'petnajst':15,'šestnajst':16,'sedemnajst':17,'osemnajst':18,'devetnajst':19,'dvajset':20,'trideset':30,'štirideset':40,'petdeset':50,'šestdeset':60,'sedemdeset':70,'osemdeset':80,'devetdeset':90,'sto':100,'stodeset':110,'stodvajset':120,'stotrideset':130,'stoštirideset':140,'stopetdeset':150,'stošestdeset':160,'stosedemdeset':170,'stoosemdeset':180};if(map[s]!==undefined)return map[s];let units={'ena':1,'en':1,'dva':2,'tri':3,'štiri':4,'pet':5,'šest':6,'sedem':7,'osem':8,'devet':9};let tens={'dvajset':20,'trideset':30,'štirideset':40,'petdeset':50,'šestdeset':60,'sedemdeset':70,'osemdeset':80,'devetdeset':90};for(let [k,v] of Object.entries(tens)){if(s.endsWith(k)){let pre=s.slice(0,-k.length).replace(/\s|in/g,'');if(units[pre]!==undefined)return v+units[pre]}}return null}
let recording=null,recordChunks=[],recordStream=null;
async function voiceInput(){
 const btn=$('mic');
 if(recording&&recording.state==='recording'){recording.stop();btn.textContent='🎙️';return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){msg('Snemanje v tem brskalniku ni podprto.');return}
 try{
  recordStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  recording=new MediaRecorder(recordStream,type?{mimeType:type}:undefined);
  recordChunks=[];
  recording.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};
  recording.onerror=()=>msg('Snemanje ni uspelo.');
  recording.onstop=async()=>{
   btn.textContent='🎙️';recordStream?.getTracks().forEach(t=>t.stop());
   msg('Prepoznavam rezultat ...');
   try{
    const blob=new Blob(recordChunks,{type:recording.mimeType||'audio/mp4'});
    if(blob.size>3e6)throw Error('Posnetek je predolg.');
    const response=await fetch('/.netlify/functions/transcribe',{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});
    const data=await response.json();
    if(!response.ok)throw Error(data.error||'Napaka prepoznave');
    const n=parseNumber(data.text||'');
    if(n===null||n>180)throw Error('Nisem razumela rezultata: '+(data.text||''));
    submit(n);msg('Glasovno vneseno: '+n);
   }catch(err){msg('Glasovni vnos: '+err.message)}
  };
  recording.start();btn.textContent='⏹';msg('Poslušam ... Povej rezultat in ponovno pritisni mikrofon.');
  setTimeout(()=>{if(recording?.state==='recording')recording.stop()},7000);
 }catch(err){msg('Mikrofon: '+(err.name==='NotAllowedError'?'Dovoli uporabo mikrofona v Safariju.':err.message))}
}
$('mic').onclick=voiceInput;names();render();
</script></html>
